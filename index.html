<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Garden</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🌱</text></svg>">
</head>
<body>
  <header class="top-bar">
    <span class="site-title">Prompt Garden</span>
    <div class="top-right">
      <nav class="mode-switch">
        <span class="mode-option active" data-mode="prompt">命题</span>
        <span class="mode-sep">/</span>
        <span class="mode-option" data-mode="term">术语</span>
      </nav>
      <nav class="lang-switch">
        <span class="lang-option active" data-lang="zh">中文</span>
        <span class="lang-sep">|</span>
        <span class="lang-option" data-lang="en">English</span>
      </nav>
    </div>
  </header>
  <main class="prompt-area">
    <p class="prompt-text" id="prompt">—</p>
    <button class="new-prompt-btn" id="newPrompt" aria-label="New prompt">&#8634; 换一个</button>
    
    <div class="timer-section" id="timerSection">
      <div class="timer-toggle" id="timerToggle" title="计时器">⏱</div>
      <div class="timer-body" id="timerBody">
        <div class="timer-circle-wrapper">
          <svg class="timer-ring" viewBox="0 0 120 120">
            <circle class="timer-ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="timer-ring-progress" id="timerRing" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="timer-display" id="timerDisplay">00:00</div>
          <div class="timer-label" id="timerLabel">—</div>
        </div>
        <div class="timer-presets">
          <button class="preset-btn" data-min="10">10 分钟</button>
          <button class="preset-btn" data-min="15">15 分钟</button>
          <button class="preset-btn" data-min="25">25 分钟</button>
        </div>
        <div class="timer-controls">
          <button class="timer-ctrl-btn" id="timerStart">▶ 开始</button>
          <button class="timer-ctrl-btn" id="timerPause" style="display:none">⏸ 暂停</button>
          <button class="timer-ctrl-btn" id="timerReset">↺ 重置</button>
          <button class="timer-ctrl-btn mode-switch-btn" id="timerModeBtn">倒计时 ▼</button>
        </div>
      </div>
    </div>
  </main>
  <script src="js/data/topics-zh.js"></script>
  <script src="js/data/topics-en.js"></script>
  <script src="js/data/index.js"></script>
  <script src="js/topic-engine.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
